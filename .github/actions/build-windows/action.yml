name: Build Windows executable
description: Check, test, build and verify the single Windows x64 executable.
inputs:
  channel:
    description: Build channel shown in the application title.
    required: false
    default: ''
  artifact-name:
    description: Name of the uploaded executable artifact.
    required: true
  expected-tag:
    description: Optional stable tag that must match the workspace version.
    required: false
    default: ''
outputs:
  version:
    description: Verified application version.
    value: ${{ steps.package.outputs.version }}
  sha256:
    description: SHA256 of the verified executable.
    value: ${{ steps.package.outputs.sha256 }}
runs:
  using: composite
  steps:
    - name: Validate release version
      if: inputs.expected-tag != ''
      shell: pwsh
      env:
        EXPECTED_TAG: ${{ inputs.expected-tag }}
      run: |
        $manifest = Get-Content -LiteralPath Cargo.toml -Raw
        $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$').Groups[1].Value
        if (!$version -or $env:EXPECTED_TAG -cne "v$version") { throw 'Release tag must match the workspace version exactly' }
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable
        components: rustfmt
        targets: x86_64-pc-windows-msvc
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        shared-key: windows-x64-release
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    - name: Check formatting
      shell: pwsh
      run: cargo fmt --all --check
    # Release tests and the executable reuse the same dependency build.
    - name: Test workspace
      shell: pwsh
      env:
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: '1'
        RESOLUTION_HUB_BUILD_CHANNEL: ${{ inputs.channel }}
      run: ./scripts/Invoke-Cargo.ps1 -TimeoutSeconds 2400 -Arguments @('test', '--workspace', '--release', '--locked', '--target', 'x86_64-pc-windows-msvc')
    - name: Build native executable
      shell: pwsh
      env:
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: '1'
        RESOLUTION_HUB_BUILD_CHANNEL: ${{ inputs.channel }}
      run: ./scripts/Invoke-Cargo.ps1 -TimeoutSeconds 900 -Arguments @('build', '-p', 'resolution-hub-native-ui', '--release', '--locked', '--target', 'x86_64-pc-windows-msvc')
    - name: Verify executable
      id: package
      shell: pwsh
      run: ./scripts/Prepare-Executable.ps1 -Executable 'target/x86_64-pc-windows-msvc/release/resolution-hub.exe' -Commit $env:GITHUB_SHA
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: artifacts/resolution-hub.exe
        if-no-files-found: error
        retention-days: 30
