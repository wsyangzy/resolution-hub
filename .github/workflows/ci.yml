name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Formatting and packaging checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Test executable dependency check
        shell: pwsh
        run: ./scripts/tests/Test-StandaloneExecutable.ps1
      - name: Test Cargo timeout handling
        shell: pwsh
        run: ./scripts/tests/Test-CargoTimeout.ps1

  windows:
    name: Check, test and build Windows x64
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-windows
        with:
          artifact-name: resolution-hub-ci-windows-x64
