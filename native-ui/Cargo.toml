[package]
name = "resolution-hub-native-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
resolution-hub = { path = "../src-tauri" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "~1.17.1", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg",
    "unstable-winit-030",
    "compat-1-2",
] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1"
